<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for advanced neon glows and linear gradients -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="emerald-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid App Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6" />

  <!-- Background decorative concentric rings representing wireless broadcast streams -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#334155" stroke-dasharray="8 12" stroke-width="2" opacity="0.3" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.2" />

  <!-- Main glowing graphic group with drop glow filters -->
  <g filter="url(#neon-glow-filter)">
    <!-- Sleek Retro TV Antennas crossing in the background -->
    <line x1="176" y1="130" x2="256" y2="230" stroke="url(#cyan-glow)" stroke-width="10" stroke-linecap="round" opacity="0.85" />
    <line x1="336" y1="130" x2="256" y2="230" stroke="url(#emerald-glow)" stroke-width="10" stroke-linecap="round" opacity="0.85" />
    
    <circle cx="176" cy="130" r="12" fill="#3b82f6" />
    <circle cx="336" cy="130" r="12" fill="#10b981" />

    <!-- Isometric/Sleek Outer Shield TV Frame shape -->
    <rect x="116" y="196" width="280" height="200" rx="40" fill="#000000" stroke="url(#cyan-glow)" stroke-width="12" opacity="0.9" />

    <!-- Glowing emerald play emblem inside the screen -->
    <path d="M 220 256 L 220 336 L 290 296 Z" fill="url(#emerald-glow)" stroke="url(#emerald-glow)" stroke-width="4" stroke-linejoin="round" />

    <!-- Sparkle star accents in the corner indicating verified quality -->
    <path d="M 370 220 L 375 230 L 385 235 L 375 240 L 370 250 L 365 240 L 355 235 L 365 230 Z" fill="#f59e0b" />
  </g>
</svg>
