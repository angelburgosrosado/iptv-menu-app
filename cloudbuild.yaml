steps:
  # 1. Build API
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/iptv-api', '-f', 'apps/api/Dockerfile', '.']
  
  # 2. Build Worker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/iptv-worker', '-f', 'apps/worker/Dockerfile', '.']
  
  # 3. Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/iptv-frontend', '-f', 'Dockerfile', '.']
    
  # 4. Push API Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/iptv-api']
    
  # 5. Push Worker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/iptv-worker']
    
  # 6. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/iptv-frontend']

  # 7. Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'iptv-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/iptv-api'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'

  # 8. Deploy Worker to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'iptv-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/iptv-worker'
      - '--region'
      - 'us-central1'
      - '--no-allow-unauthenticated'

  # 9. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'iptv-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/iptv-frontend'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/iptv-api'
  - 'gcr.io/$PROJECT_ID/iptv-worker'
  - 'gcr.io/$PROJECT_ID/iptv-frontend'
